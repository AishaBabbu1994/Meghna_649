<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memorizador 95</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { scrollbar-color:#c0c0c0 #dfdfdf; }
body {
  font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Geneva,Verdana,sans-serif;
  background:#008080;
  height:100vh;
  height:100dvh;
  padding:14px;
  display:flex;
  overflow:hidden;
  font-size:13px;
  -webkit-tap-highlight-color:transparent;
}
body.maximizado { padding:0; }
body.maximizado .window { max-width:none; }
body.minimizado .content, body.minimizado .statusbar { display:none; }

::-webkit-scrollbar { width:14px; height:14px; }
::-webkit-scrollbar-track { background:#dfdfdf; }
::-webkit-scrollbar-thumb {
  background:#c0c0c0;
  box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
}

/* ---------- Ventana ---------- */
.window {
  background:#c0c0c0;
  box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff;
  padding:3px;
  width:100%;
  max-width:840px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.titlebar {
  background:#000080;
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 4px 4px 6px;
  font-weight:bold;
  flex-shrink:0;
  user-select:none;
}
.titlebar .txt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tbtn {
  width:20px; height:17px;
  background:#c0c0c0; border:none; cursor:pointer; color:#000; padding:0;
  box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
  font-family:inherit; font-size:9px; font-weight:bold; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.tbtn:active { box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }

/* ---------- Contenido ---------- */
.content {
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:7px;
  padding:8px 6px 6px;
  overflow-y:auto;
}

.modes { display:flex; flex-wrap:wrap; gap:5px 16px; align-items:center; flex-shrink:0; }
.modegroup { display:flex; align-items:center; gap:4px; }
.glabel { font-size:11px; font-weight:bold; }

.btn {
  background:#c0c0c0; border:none; cursor:pointer; color:#000;
  font-family:inherit; font-size:12px; font-weight:bold;
  padding:7px 10px; min-height:34px;
  touch-action:manipulation;
  box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
}
.btn:active { box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
.btn.active {
  background:#dfdfdf;
  box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080;
}

.hint, textarea, #displayText {
  background:#fff; border:none; width:100%;
  box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
}
.hint { padding:6px 8px; font-size:12px; flex-shrink:0; }

textarea {
  font-family:inherit; font-size:14px; line-height:1.5;
  padding:6px 8px; height:76px; flex-shrink:0; resize:none; outline:none;
}

.buttons { display:grid; grid-template-columns:repeat(auto-fit, minmax(104px,1fr)); gap:5px; flex-shrink:0; }

#displayText {
  flex:1; min-height:90px;
  overflow-y:auto;
  padding:10px 12px;
  font-size:16px; line-height:2.1;
  word-wrap:break-word;
}

/* ---------- Palabras ---------- */
.word { padding:1px 3px; cursor:pointer; transition:background-color .06s; touch-action:manipulation; }
@media (hover:hover) { .word:hover { background:#dfdfdf; } }
.word.range-start { background:#808080 !important; color:#fff !important; }
.word.hidden {
  background:#000080 !important; color:transparent !important;
  position:relative; user-select:none;
}
.word.hidden::after {
  content:'•••';
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  color:#fff; font-size:10px; pointer-events:none;
}
.word.revealed { background:#008080 !important; color:#fff !important; }
.word.revealed::after { content:none !important; }

/* ---------- Barra de estado ---------- */
.statusbar { display:flex; gap:2px; flex-shrink:0; padding-top:2px; }
.spanel {
  flex:1; min-width:0; white-space:nowrap;
  box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
  padding:3px 6px; font-size:11px;
}
.spanel b { font-size:12px; }
.spanel.grip {
  flex:0 0 22px; padding:0;
  background-image:linear-gradient(135deg, #fff 25%, #808080 25%, #808080 50%, #fff 50%, #fff 75%, #808080 75%);
  background-size:3px 3px;
}

/* ---------- Aviso estilo tooltip ---------- */
#toast {
  position:fixed; left:50%; bottom:16px;
  transform:translate(-50%,12px);
  background:#ffffe1; border:1px solid #000;
  box-shadow:2px 2px 0 rgba(0,0,0,.35);
  padding:8px 14px; font-size:13px; font-weight:bold;
  max-width:calc(100vw - 24px);
  opacity:0; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease;
  z-index:99; text-align:center;
}
#toast.show { opacity:1; transform:translate(-50%,0); }

/* ---------- Pantallas pequeñas ---------- */
@media (max-width:600px) {
  body { padding:0; }
  .window { max-width:none; }
  .content { gap:6px; padding:7px 4px 5px; }
  #displayText { font-size:15px; line-height:2; padding:8px 10px; }
  .buttons { grid-template-columns:repeat(auto-fit, minmax(92px,1fr)); }
  .btn { min-height:38px; padding:6px; }
}
@media (max-height:520px) {
  textarea { height:48px; }
  #displayText { min-height:60px; }
  .hint { padding:4px 8px; }
}
</style>
</head>
<body>
    <div class="window">
        <div class="titlebar">
            <span class="txt">🔨 Memorizador 95</span>
            <button class="tbtn" id="btnMin" title="Minimizar">_</button>
            <button class="tbtn" id="btnMax" title="Maximizar">□</button>
            <button class="tbtn" id="btnClose" title="Cerrar">✕</button>
        </div>

        <div class="content">
            <div class="modes">
                <div class="modegroup">
                    <span class="glabel">Modo:</span>
                    <button class="btn active" onclick="setMode('edit', this)">✏️ Editar</button>
                    <button class="btn" onclick="setMode('study', this)">📚 Estudiar</button>
                </div>
                <div class="modegroup">
                    <span class="glabel">Selección:</span>
                    <button class="btn active" onclick="setSelectMode('word', this)">👆 Palabra</button>
                    <button class="btn" onclick="setSelectMode('extract', this)">📝 Extracto</button>
                </div>
            </div>

            <div class="hint" id="hint">💡 Toca cada palabra para ocultarla individualmente.</div>

            <textarea id="inputText" placeholder="Pega tu texto aquí..."></textarea>

            <div class="buttons">
                <button class="btn" onclick="loadText()">📥 Cargar</button>
                <button class="btn" onclick="cancelSelection()">↩️ Cancelar</button>
                <button class="btn" onclick="hideAll()">🙈 Ocultar todo</button>
                <button class="btn" onclick="revealAll()">👀 Mostrar todo</button>
                <button class="btn" onclick="clearAll()">🗑️ Limpiar</button>
            </div>

            <div id="displayText"></div>
        </div>

        <div class="statusbar">
            <div class="spanel"><b id="totalWords">0</b> Palabras</div>
            <div class="spanel"><b id="hiddenWords">0</b> Ocultas</div>
            <div class="spanel"><b id="progress">0%</b> Progreso</div>
            <div class="spanel grip"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let currentMode = 'edit';
        let selectMode = 'word';
        let rangeStartIndex = null;
        let allWords = [];
        let groupIdCounter = 0;
        let prevProgress = 0;
        let toastTimer = null;

        function showToast(msg, ms = 2600) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), ms);
        }

        function hideToast() {
            clearTimeout(toastTimer);
            document.getElementById('toast').classList.remove('show');
        }

        document.getElementById('btnMin').onclick = () => document.body.classList.toggle('minimizado');
        document.getElementById('btnMax').onclick = function () {
            const max = document.body.classList.toggle('maximizado');
            this.textContent = max ? '❐' : '□';
        };
        document.getElementById('btnClose').onclick = () => showToast('😉 ¡Bonito intento! Esta ventana no se cierra.');

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.modegroup')[0].querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            cancelSelection();
            updateHint();
        }

        function setSelectMode(mode, btn) {
            selectMode = mode;
            document.querySelectorAll('.modegroup')[1].querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            cancelSelection();
            updateHint();
        }

        function updateHint() {
            const hint = document.getElementById('hint');
            if (currentMode === 'study') {
                hint.textContent = '📚 Modo estudio: pulsa cualquier palabra oculta para ver/desaparecer el bloque.';
            } else if (selectMode === 'word') {
                hint.textContent = '💡 Toca cada palabra para ocultarla individualmente.';
            } else {
                hint.textContent = '💡 Toca PRIMERA palabra, luego ÚLTIMA palabra del extracto.';
            }
        }

        function loadText() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                showToast('⚠️ Escribe algún texto primero');
                return;
            }

            const display = document.getElementById('displayText');
            display.innerHTML = '';
            allWords = [];
            groupIdCounter = 0;
            rangeStartIndex = null;

            const tokens = input.match(/\S+|\s+/g) || [];
            tokens.forEach(token => {
                if (/^\s+$/.test(token)) {
                    display.appendChild(document.createTextNode(token));
                } else {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = token;
                    span.dataset.index = allWords.length;
                    span.onclick = () => handleWordClick(span);
                    display.appendChild(span);
                    allWords.push(span);
                }
            });

            updateStats();
        }

        function handleWordClick(element) {
            if (currentMode === 'study') {
                if (element.classList.contains('hidden')) {
                    const groupId = element.dataset.groupId;
                    allWords.forEach(w => {
                        if (w.dataset.groupId === groupId) {
                            w.classList.toggle('revealed');
                        }
                    });
                }
                return;
            }

            if (selectMode === 'word') {
                element.classList.toggle('hidden');
                element.classList.remove('revealed');
                if (!element.dataset.groupId) {
                    element.dataset.groupId = 'g' + (groupIdCounter++);
                }
                updateStats();
            } else {
                const index = parseInt(element.dataset.index);

                if (rangeStartIndex === null) {
                    rangeStartIndex = index;
                    element.classList.add('range-start');
                    showToast(`✅ Inicio: "${element.textContent}". Ahora toca la ÚLTIMA palabra.`, 4000);
                } else {
                    const start = Math.min(rangeStartIndex, index);
                    const end = Math.max(rangeStartIndex, index);
                    const newGroupId = 'g' + (groupIdCounter++);

                    for (let i = start; i <= end; i++) {
                        allWords[i].classList.add('hidden');
                        allWords[i].classList.remove('range-start', 'revealed');
                        allWords[i].dataset.groupId = newGroupId;
                    }

                    rangeStartIndex = null;
                    hideToast();
                    updateStats();
                }
            }
        }

        function cancelSelection() {
            if (rangeStartIndex !== null) {
                allWords.forEach(w => w.classList.remove('range-start'));
                rangeStartIndex = null;
                hideToast();
            }
        }

        function hideAll() {
            const newGroupId = 'g' + (groupIdCounter++);
            allWords.forEach(w => {
                w.classList.add('hidden');
                w.classList.remove('revealed', 'range-start');
                w.dataset.groupId = newGroupId;
            });
            cancelSelection();
            updateStats();
        }

        function revealAll() {
            allWords.forEach(w => {
                w.classList.remove('hidden', 'revealed', 'range-start');
            });
            updateStats();
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('displayText').innerHTML = '';
            allWords = [];
            rangeStartIndex = null;
            groupIdCounter = 0;
            hideToast();
            updateStats();
        }

        function updateStats() {
            const total = allWords.length;
            const hidden = allWords.filter(w => w.classList.contains('hidden')).length;
            document.getElementById('totalWords').textContent = total;
            document.getElementById('hiddenWords').textContent = hidden;
            const p = total > 0 ? Math.round((hidden / total) * 100) : 0;
            document.getElementById('progress').textContent = p + '%';
            if (p === 100 && prevProgress < 100 && total > 0) {
                showToast('🎉 ¡100%! Todo oculto, ¡a estudiar!', 3000);
            }
            prevProgress = p;
        }
    </script>
</body>
</html>
